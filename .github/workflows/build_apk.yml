name: Patch TizenTube APK with VOT

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download apktool
        run: |
          curl -Lo apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar

      - name: Download latest TizenTubeCobalt APK
        run: |
          API_JSON=$(curl -fsSL https://api.github.com/repos/reisxd/TizenTubeCobalt/releases/latest)
          APK_URL=$(python3 -c "import json,sys; d=json.loads(sys.argv[1]); urls=[a['browser_download_url'] for a in d.get('assets',[]) if a.get('name','').endswith('.apk')]; pref=[u for u in urls if u.endswith('cobalt-arm.apk')]; print((pref or urls)[0])" "$API_JSON")
          echo "Downloading: $APK_URL"
          curl -fL --retry 5 --retry-delay 2 -o tizentube.apk "$APK_URL"
          unzip -tq tizentube.apk
          ls -lh tizentube.apk

      - name: Decompile APK
        run: |
          java -jar apktool.jar d tizentube.apk -o apk_out -f

      # ==== VOT injection: URL-redirect method ====
      # The live YouTube TV page is loaded over the network. The ONLY proven
      # mechanism to run custom JS inside it is the native "userScript" URL
      # fetch baked into libchrobalt.so, which the app calls on every page
      # load. We redirect that URL to our own hosted vot.js (on cdn.jsdelivr's
      # GitHub-backed CDN, same origin as the original so it passes script-src
      # CSP). vot.js itself first loads the REAL upstream userScript.js
      # (preserving all TizenTube features), then adds the Yandex VOT overlay,
      # a native player-menu toggle, and a YELLOW-button hotkey.
      - name: Patch embedded userScript URL to load vot.js (preserves device patches)
        run: |
          python3 patch_tizentube_userscript_url.py apk_out

      # The live page's CSP connect-src blocks our VOT worker
      # (vot-worker.kload.workers.dev) with "Refused to connect ...".
      # TizenTubeCobalt hardcodes three extra connect-src hosts inside
      # libchrobalt.so (sponsor.ajay.app / dearrow-thumb.ajay.app /
      # tizentube.app). We repurpose the two low-value ones in-place
      # (length-preserving) so the worker becomes an allowed connect-src host.
      # sponsor.ajay.app (SponsorBlock + DeArrow titles) stays intact.
      - name: Patch CSP connect-src allowlist to permit the VOT worker
        run: |
          python3 patch_csp_connect_src.py apk_out

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Recompile APK
        run: |
          java -jar apktool.jar b apk_out -o tizentube_vot_unsigned.apk
          ls -lh tizentube_vot_unsigned.apk

      - name: Align and sign APK
        run: |
          BT=$ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)
          $BT/zipalign -v 4 tizentube_vot_unsigned.apk tizentube_vot_aligned.apk
          $BT/apksigner sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out tizentube_vot.apk \
            tizentube_vot_aligned.apk
          ls -lh tizentube_vot.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TizenTubeCobalt-VOT
          path: tizentube_vot.apk
          retention-days: 30
